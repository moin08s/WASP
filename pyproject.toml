[project]
name = "wasp"
version = "1.4.0"
description = "WASP: Automated digital forensics tool for metadata extraction, artefact parsing, timeline reconstruction, SHA-256 integrity, and reporting."
readme = "README.md"
authors = [
    { name = "WASP Forensics Contributors" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[project.scripts]
wasp = "chronotrace.cli.main:app"
chronotrace = "chronotrace.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

